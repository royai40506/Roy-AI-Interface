name: Roy AI Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: artifacts/roy-ai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: npx cap sync android
      - run: chmod +x android/gradlew

      - run: |
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Roy-AI-debug-apk
          path: artifacts/roy-ai/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Roy AI Latest
          prerelease: false
          make_latest: true
          files: artifacts/roy-ai/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
