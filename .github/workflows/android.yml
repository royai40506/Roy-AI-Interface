name: Roy AI Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: artifacts/roy-ai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - run: pnpm install --no-frozen-lockfile

      - name: Read app version
        id: app-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{print ($1 * 10000) + ($2 * 100) + $3}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - run: pnpm build
      - run: npx cap sync android
      - run: chmod +x android/gradlew

      - name: Prepare Android signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/roy-ai-release.jks
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/artifacts/roy-ai/android/roy-ai-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -PversionName="${{ steps.app-version.outputs.version }}" \
            -PversionCode="${{ steps.app-version.outputs.version_code }}" \
            --stacktrace --info

      - uses: actions/upload-artifact@v4
        with:
          name: Roy-AI-release-apk
          path: artifacts/roy-ai/android/app/build/outputs/apk/release/app-release.apk

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Roy AI Latest
          body: "version=${{ steps.app-version.outputs.version }}"
          prerelease: false
          make_latest: true
          files: artifacts/roy-ai/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
